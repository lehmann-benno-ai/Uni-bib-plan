name: Publish site and room data to GitHub Pages

# Builds static/ plus fresh UB room data (rooms/<building>/<date>.json) and force-pushes it to the
# gh-pages branch. Pages setting: Source "Deploy from a branch", branch gh-pages, folder / (root).
on:
  push:
    branches: [main]
  schedule:
    - cron: "*/10 * * * *"  # GitHub runs this roughly every 10-20 minutes
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build site with room data
        run: |
          cp -r static _site
          touch _site/.nojekyll
          python3 scripts/build_pages_data.py _site
      - name: Push to gh-pages
        working-directory: _site
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Publish site and room data ($(date -u +%FT%TZ))"
          git push -fq "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
